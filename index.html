<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Life Command Center</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
body {
    margin:0;
    font-family:system-ui;
    background:#0b0d10;
    color:white;
}
.container {
    padding:15px;
    max-width:900px;
    margin:auto;
}
.card {
    background:#141820;
    padding:15px;
    border-radius:10px;
    border:1px solid #222;
    margin-top:15px;
}
input, button {
    width:100%;
    padding:10px;
    margin-top:6px;
    border:none;
    border-radius:8px;
}
button {
    background:#00ff9f;
    color:black;
}
.small {
    font-size:12px;
    color:#aaa;
}
</style>
</head>

<body>

<div class="container">

<h1>Life Command Center</h1>

<div class="card">
<h2>Login</h2>
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login / Signup</button>
</div>

<div class="card">
<h2>Decision Engine</h2>
<input id="item" placeholder="Item">
<input id="price" placeholder="Price">
<input id="need" placeholder="Need (1-10)">
<input id="quality" placeholder="Quality (1-10)">
<button onclick="decide()">Evaluate</button>
<div id="result"></div>
</div>

<div class="card">
<h2>AI Operator</h2>
<input id="prompt" placeholder="Ask anything">
<button onclick="askAI()">Run</button>
<div id="chat"></div>
</div>

<div class="card">
<h2>Money</h2>
<div id="spend"></div>
</div>

<div class="card">
<h2>Fitness (Operation 175)</h2>
<input id="weight" placeholder="Weight">
<button onclick="logWeight()">Log</button>
<div id="weights"></div>
</div>

<div class="card">
<h2>Style System</h2>
Daily → Polo + shorts + Porto Covo<br>
Work → Button + chinos + D1 Milano<br>
Date → Black fit + D1 Milano
</div>

<div class="card">
<h2>Watch Collection</h2>
GADA → Borealis Porto Covo<br>
Dress → D1 Milano Ultra Thin
</div>

</div>

<script>

// ✅ YOUR REAL SUPABASE KEYS
const SUPABASE_URL = "https://astkfmibnwzbkhhcqfkq.supabase.co";
const SUPABASE_KEY = "sb_publishable_mdXXIeBt_waTEMh3u8C6ZQ_wenQWzrq";

const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let user = null;
let data = {decisions:[], spend:0, weights:[]};

// 🔐 LOGIN
async function login(){

let email = document.getElementById("email").value;
let password = document.getElementById("password").value;

// Try login
let { error } = await supabase.auth.signInWithPassword({email,password});

// If login fails → signup
if(error){
    await supabase.auth.signUp({email,password});
}

// Get user
let res = await supabase.auth.getUser();
user = res.data.user;

loadData();
}

// 📥 LOAD DATA
async function loadData(){

let { data:rows } = await supabase
.from("lifeos")
.select("*")
.eq("user_id", user.id)
.limit(1);

if(rows.length){
    data = rows[0].data;
}

render();
}

// 💾 SAVE DATA
async function saveData(){

await supabase
.from("lifeos")
.upsert({
    user_id: user.id,
    data: data
});
}

// 🧠 DECISION ENGINE
function decide(){

let item = document.getElementById("item").value;
let price = parseFloat(document.getElementById("price").value);
let need = parseFloat(document.getElementById("need").value);
let quality = parseFloat(document.getElementById("quality").value);

let score = (need*2 + quality) - (price/100);

let decision = score > 15 ? "BUY" : score > 10 ? "WAIT" : "SKIP";

data.decisions.push({item, price, decision});
if(decision==="BUY") data.spend += price;

saveData();
render();

document.getElementById("result").innerHTML = "Decision: " + decision;
}

// 🏋️ WEIGHT TRACKER
function logWeight(){

let w = document.getElementById("weight").value;
data.weights.push(w);

saveData();
render();
}

// 🤖 AI (SECURE FUNCTION CALL)
async function askAI(){

let prompt = document.getElementById("prompt").value;

let response = await fetch("/.netlify/functions/ai", {
  method: "POST",
  body: JSON.stringify({ prompt })
});

let json = await response.json();
let reply = json.choices[0].message.content;

document.getElementById("chat").innerHTML += `<div class="small">${reply}</div>`;
}

// 🎯 RENDER UI
function render(){

document.getElementById("spend").innerHTML = "Total Spend: $" + data.spend;

document.getElementById("weights").innerHTML =
data.weights.slice(-5).join(", ");

}

</script>

</body>
</html>
